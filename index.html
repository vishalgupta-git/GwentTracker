<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gwent Tracker · Witcher 3 card collection</title>
    <meta name="theme-color" content="#211a14" />
    <meta name="google-site-verification" content="ddvjVpgJPZvQpz6mDIlIJaG2AHBFZtg317acLCfCEm0" />
    <script>
      // Saved choice wins, else follow the OS. Runs before paint (no flash).
      ;(() => {
        let saved = null
        try { saved = localStorage.getItem('theme') } catch {}
        const m = matchMedia('(prefers-color-scheme: dark)')
        const apply = () =>
          document.documentElement.classList.toggle('dark', saved ? saved === 'dark' : m.matches)
        apply()
        m.addEventListener('change', () => { if (!saved) apply() })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
