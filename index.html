<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="See which Witcher 3 Gwent cards you're missing, where to find them, and which ones are missable." />
    <title>Gwent Tracker — Witcher 3 card collection checker</title>
    <script>
      // Follow the OS theme; shadcn tokens switch on the .dark class.
      const m = matchMedia('(prefers-color-scheme: dark)')
      const apply = () => document.documentElement.classList.toggle('dark', m.matches)
      apply()
      m.addEventListener('change', apply)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
